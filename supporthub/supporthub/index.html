<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupportHub — Operations & Role-Based Access Control</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <!--
    Frontend dependencies are loaded by the bootloader at the bottom of this file.
    This avoids the old failure mode where a blocked/failed CDN script left the page
    permanently stuck on the initial loading screen.
  -->

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F5F6F8;
      color: #151B2C;
      -webkit-font-smoothing: antialiased;
    }
    input, select, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.25s ease-out forwards; }
    .hover-lift {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    .btn-action { transition: all 0.15s ease; }
    .btn-action:hover { filter: brightness(1.08); transform: scale(1.02); }
    .btn-action:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <!-- Loading spinner shown until React renders -->
  <div id="loading-screen" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#141B33;font-family:sans-serif;">
    <div style="width:48px;height:48px;border-radius:12px;background:#2F6FED;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;margin-bottom:18px;">S</div>
    <div style="color:#fff;font-size:16px;font-weight:600;margin-bottom:10px;">SupportHub</div>
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:20px;">Loading application...</div>
    <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.2);border-top-color:#2F6FED;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <div id="root"></div>
  <script>
    // Global error handler - shows message instead of blank screen
    window.onerror = function(msg, src, line, col) {
      var el = document.getElementById('loading-screen');
      if(el) {
        el.innerHTML = '<div style="padding:40px;text-align:center;color:#fff;"><div style="font-size:32px;margin-bottom:16px;">⚠️</div><div style="font-size:18px;font-weight:700;margin-bottom:10px;">Script Error</div><div style="font-size:13px;color:rgba(255,255,255,0.6);max-width:400px;">' + msg + '<br><br>Line: ' + line + (col ? ', Column: ' + col : '') + '</div><div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,0.4);">Open browser DevTools (F12) → Console for details</div></div>';
      }
    };
    // Hide loading screen once React mounts
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('loading-screen');
        if(root && loader) {
          var obs = new MutationObserver(function() { if(root.children.length > 0){ loader.style.display='none'; obs.disconnect(); } });
          obs.observe(root, {childList:true});
        }
      }, 100);
    });
  </script>

  <script id="supporthub-app-source" type="text/plain">
    const { useState, useEffect, useMemo } = React;
    const {
      ResponsiveContainer, AreaChart, Area, XAxis, YAxis, CartesianGrid,
      Tooltip, PieChart, Pie, Cell, BarChart, Bar
    } = window.Recharts || {};

    /* ---------------------------------- ICONS HELPER ---------------------------------- */
    const Icons = {
      LayoutDashboard: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      ),
      Ticket: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
      ),
      Users: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      ),
      ShieldCheck: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      ),
      FileSignature: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 19.5v.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8.5L20 7.5V11"/><polyline points="14 2 14 8 20 8"/><path d="M18.42 15.61a2.1 2.1 0 1 1 2.97 2.97L15 24h-3v-3l6.42-5.39z"/></svg>
      ),
      Search: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      ),
      Bell: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      ),
      LogIn: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
      ),
      LogOut: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      ),
      Plus: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      ),
      X: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      ),
      Circle: ({ size = 8, color = "currentColor", fill = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>
      ),
      ChevronRight: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      ),
      AlertCircle: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      ),
      CheckCircle2: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      ),
      Clock: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ),
      TrendingUp: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      ),
      Database: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
      ),
      RefreshCw: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      ),
      Lock: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      ),
      Key: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
      ),
      UserCheck: ({ size = 16, color = "currentColor" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
      ),
    };

    /* ---------------------------------- THEME COLORS ---------------------------------- */
    const COLORS = {
      ink: "#151B2C",
      navy: "#1C2540",
      navyDeep: "#141B33",
      paper: "#F5F6F8",
      card: "#FFFFFF",
      line: "#E6E8EE",
      sub: "#6B7280",
      accent: "#2F6FED",
      accentSoft: "#E8EFFE",
      amber: "#B7791F",
      amberSoft: "#FBF0DD",
      green: "#1C8A5A",
      greenSoft: "#E4F5EC",
      red: "#C0392B",
      redSoft: "#FBE9E7",
      purple: "#7C3AED",
      purpleSoft: "#F3E8FF",
    };

    const priorityColor = (p) =>
      p === "Critical" ? COLORS.red : p === "High" ? "#C0392B" : p === "Medium" ? COLORS.amber : COLORS.sub;

    const statusStyle = (s) => {
      if (s === "Open") return { bg: COLORS.redSoft, fg: COLORS.red };
      if (s === "In Progress") return { bg: COLORS.amberSoft, fg: COLORS.amber };
      if (s === "Resolved") return { bg: COLORS.greenSoft, fg: COLORS.green };
      if (s === "Sent") return { bg: COLORS.accentSoft, fg: COLORS.accent };
      if (s === "Accepted") return { bg: COLORS.greenSoft, fg: COLORS.green };
      if (s === "Declined") return { bg: COLORS.redSoft, fg: COLORS.red };
      return { bg: "#EEE", fg: COLORS.sub };
    };

    function Pill({ children, bg, fg }) {
      return (
        <span style={{
          background: bg, color: fg, fontSize: 12, fontWeight: 600,
          padding: "4px 10px", borderRadius: 20, whiteSpace: "nowrap", display: "inline-flex", alignItems: "center"
        }}>{children}</span>
      );
    }

    function StatCard({ label, value, delta, icon: Icon, tone }) {
      return (
        <div className="hover-lift" style={{
          background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12,
          padding: "18px 20px", flex: 1, minWidth: 200, boxShadow: "0 1px 3px rgba(0,0,0,0.03)"
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 12.5, color: COLORS.sub, fontWeight: 600, marginBottom: 8 }}>{label}</div>
              <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.ink, letterSpacing: -0.5 }}>{value}</div>
            </div>
            <div style={{
              width: 36, height: 36, borderRadius: 10, background: tone + "1A",
              display: "flex", alignItems: "center", justifyContent: "center"
            }}>
              <Icon size={18} color={tone} />
            </div>
          </div>
          {delta && <div style={{ fontSize: 12, color: COLORS.green, marginTop: 10, fontWeight: 600 }}>{delta}</div>}
        </div>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      const isErr = toast.type === "error";
      return (
        <div style={{
          position: "fixed", bottom: 24, right: 24, zIndex: 9999,
          background: isErr ? COLORS.red : COLORS.navy, color: "#fff",
          padding: "12px 20px", borderRadius: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.18)",
          display: "flex", alignItems: "center", gap: 10, fontSize: 13.5, fontWeight: 500,
          animation: "fadeIn 0.2s ease-out"
        }}>
          {isErr ? <Icons.AlertCircle size={17} color="#fff" /> : <Icons.CheckCircle2 size={17} color="#4ADE80" />}
          {toast.message}
        </div>
      );
    }

    /* ---------------------------------- LOGIN SCREEN (2FA MOBILE AUTH) ---------------------------------- */
    function LoginScreen({ onLoginSuccess }) {
      const [step, setStep] = useState("credentials"); // "credentials" | "mobile_auth"
      const [empId, setEmpId] = useState("E-105");
      const [password, setPassword] = useState("admin123");
      const [authCode, setAuthCode] = useState("");
      const [authInfo, setAuthInfo] = useState(null); // { emp_id, name, masked_phone, auth_code_preview }
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [resendTimer, setResendTimer] = useState(0);

      useEffect(() => {
        let interval = null;
        if (resendTimer > 0) {
          interval = setInterval(() => setResendTimer(t => t - 1), 1000);
        }
        return () => clearInterval(interval);
      }, [resendTimer]);

      // Step 1: Validate Emp ID & Password
      const handleInitiateLogin = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setError("");
        try {
          const res = await fetch("/api/auth/initiate-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emp_id: empId.trim(), password: password.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Invalid Employee ID or Password");
          setAuthInfo(data);
          setStep("mobile_auth");
          setAuthCode(data.auth_code_preview || ""); // prefill demo OTP for convenience
          setResendTimer(30);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Step 2: Verify 6-digit Mobile Auth code
      const handleVerifyAuthCode = async (e) => {
        if (e) e.preventDefault();
        if (!authCode) return;
        setLoading(true);
        setError("");
        try {
          const res = await fetch("/api/auth/verify-mobile-auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emp_id: authInfo.emp_id, auth_code: authCode.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Invalid or expired Auth Code");
          onLoginSuccess(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleResendCode = async () => {
        if (resendTimer > 0 || !authInfo) return;
        setLoading(true);
        setError("");
        try {
          const res = await fetch("/api/auth/resend-mobile-auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emp_id: authInfo.emp_id })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Failed to resend Auth Code");
          setAuthInfo(data);
          setAuthCode(data.auth_code_preview || "");
          setResendTimer(30);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const quickSelect = (id, pw) => {
        setEmpId(id);
        setPassword(pw);
        setStep("credentials");
        setError("");
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg, #141B33 0%, #1C2540 100%)", padding: 20, position: "relative" }}>
          
          {/* Simulated SMS Notification Banner */}
          {step === "mobile_auth" && authInfo && (
            <div className="fade-in hover-lift" style={{
              position: "fixed", top: 24, right: 24, zIndex: 10000,
              background: "#FFFFFF", color: COLORS.ink,
              border: `1px solid ${COLORS.accent}`, borderRadius: 12,
              padding: "14px 18px", boxShadow: "0 12px 32px rgba(0,0,0,0.22)",
              maxWidth: 380, width: "calc(100% - 48px)"
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <span style={{ fontSize: 16 }}>📱</span>
                <span style={{ fontWeight: 700, fontSize: 13, color: COLORS.accent }}>Incoming SMS · Mobile Auth ID</span>
                <span style={{ marginLeft: "auto", fontSize: 11, color: COLORS.sub }}>Just now</span>
              </div>
              <div style={{ fontSize: 13, color: COLORS.ink }}>
                Your SupportHub Mobile Verification Code for <b>{authInfo.name}</b> is:
                <div style={{ fontSize: 20, fontWeight: 800, color: COLORS.navy, letterSpacing: 2, margin: "6px 0", background: "#F1F5F9", padding: "4px 8px", borderRadius: 6, display: "inline-block" }}>
                  {authInfo.auth_code_preview}
                </div>
              </div>
              <button
                type="button"
                onClick={() => {
                  setAuthCode(authInfo.auth_code_preview);
                  handleVerifyAuthCode();
                }}
                style={{
                  marginTop: 6, width: "100%", padding: "6px", borderRadius: 6,
                  border: "none", background: COLORS.accent, color: "#fff",
                  fontSize: 12, fontWeight: 600, cursor: "pointer"
                }}
              >
                Auto-fill & Log In Instantly
              </button>
            </div>
          )}

          <div className="fade-in" style={{ width: "100%", maxWidth: 450, background: "#FFFFFF", borderRadius: 18, padding: "36px 32px", boxShadow: "0 20px 40px rgba(0,0,0,0.28)" }}>
            <div style={{ textAlign: "center", marginBottom: 26 }}>
              <div style={{ width: 48, height: 48, borderRadius: 12, background: COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 12px", color: "#fff", fontWeight: 800, fontSize: 22 }}>
                S
              </div>
              <h2 style={{ fontSize: 22, fontWeight: 800, color: COLORS.ink, letterSpacing: -0.5 }}>SupportHub Login</h2>
              <p style={{ fontSize: 13, color: COLORS.sub, marginTop: 4 }}>
                {step === "credentials" ? "Employee ID & Mobile Two-Factor Authentication" : "Step 2: 2-Factor Mobile Auth Verification"}
              </p>
            </div>

            {error && (
              <div style={{ background: COLORS.redSoft, color: COLORS.red, padding: "10px 14px", borderRadius: 8, fontSize: 13, marginBottom: 18, display: "flex", alignItems: "center", gap: 8 }}>
                <Icons.AlertCircle size={16} />
                <span>{error}</span>
              </div>
            )}

            {/* STEP 1: Emp ID + Password Form */}
            {step === "credentials" ? (
              <form onSubmit={handleInitiateLogin} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <div>
                  <label style={{ display: "block", fontSize: 12.5, fontWeight: 600, color: COLORS.ink, marginBottom: 6 }}>Employee ID (Emp ID)</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. E-105 or E-101"
                    value={empId}
                    onChange={e => setEmpId(e.target.value)}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 14, outline: "none" }}
                  />
                </div>

                <div>
                  <label style={{ display: "block", fontSize: 12.5, fontWeight: 600, color: COLORS.ink, marginBottom: 6 }}>Password</label>
                  <input
                    type="password"
                    required
                    placeholder="Enter your password"
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 14, outline: "none" }}
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="btn-action"
                  style={{

    /* ---------------------------------- ISSUE TRACKER ---------------------------------- */
    function IssueTracker({ tickets, onAddTicket, onCycleStatus, onDeleteTicket, searchQuery, currentUser }) {
      const [filter, setFilter] = useState("All");
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ title: "", requester: currentUser?.name || "", priority: "Medium" });

      const filtered = tickets.filter(t => {
        const matchesFilter = filter === "All" ? true : t.status === filter;
        const matchesSearch = !searchQuery || 
          t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.requester.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.id.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.title || !form.requester) return;
        onAddTicket(form);
        setForm({ title: "", requester: currentUser?.name || "", priority: "Medium" });
        setShowForm(false);
      };

      return (
        <div className="fade-in">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ display: "flex", gap: 8 }}>
              {["All", "Open", "In Progress", "Resolved"].map(f => (
                <button key={f} onClick={() => setFilter(f)} style={{
                  padding: "7px 14px", borderRadius: 8, border: `1px solid ${filter === f ? COLORS.navy : COLORS.line}`,
                  background: filter === f ? COLORS.navy : COLORS.card, color: filter === f ? "#fff" : COLORS.ink,
                  fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all 0.15s ease"
                }}>{f}</button>
              ))}
            </div>
            <button className="btn-action" onClick={() => setShowForm(!showForm)} style={{
              display: "flex", alignItems: "center", gap: 6, background: COLORS.accent, color: "#fff",
              border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 13.5, fontWeight: 600, cursor: "pointer"
            }}>
              <Icons.Plus size={16} /> New ticket
            </button>
          </div>

          {showForm && (
            <form onSubmit={handleSubmit} style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 18, marginBottom: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
              <input placeholder="Issue title / description" required value={form.title} onChange={e => setForm({ ...form, title: e.target.value })}
                style={{ flex: 2, minWidth: 200, padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5 }} />
              <input placeholder="Requester name" required value={form.requester} onChange={e => setForm({ ...form, requester: e.target.value })}
                style={{ flex: 1, minWidth: 160, padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5 }} />
              <select value={form.priority} onChange={e => setForm({ ...form, priority: e.target.value })}
                style={{ padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5, background: "#fff" }}>
                <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
              </select>
              <button type="submit" className="btn-action" style={{ background: COLORS.navy, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Save to SQL</button>
            </form>
          )}

          <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.02)" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead>
                <tr style={{ background: COLORS.paper, textAlign: "left" }}>
                  {["Ticket ID", "Issue Title", "Requester", "Priority", "Status (Click to cycle)", "Assignee", "Created", ""].map(h => (
                    <th key={h} style={{ padding: "12px 16px", color: COLORS.sub, fontWeight: 600, fontSize: 12 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr>
                    <td colSpan="8" style={{ padding: "32px", textAlign: "center", color: COLORS.sub }}>No tickets found matching criteria.</td>
                  </tr>
                ) : (
                  filtered.map(t => {
                    const s = statusStyle(t.status);
                    return (
                      <tr key={t.id} style={{ borderTop: `1px solid ${COLORS.line}` }}>
                        <td style={{ padding: "14px 16px", color: COLORS.sub, fontWeight: 600 }}>{t.id}</td>
                        <td style={{ padding: "14px 16px", color: COLORS.ink, fontWeight: 500 }}>{t.title}</td>
                        <td style={{ padding: "14px 16px", color: COLORS.sub }}>{t.requester}</td>
                        <td style={{ padding: "14px 16px" }}>
                          <span style={{ color: priorityColor(t.priority), fontWeight: 600 }}>{t.priority}</span>
                        </td>
                        <td style={{ padding: "14px 16px" }}>
                          <button onClick={() => onCycleStatus(t.id)} title="Click to advance status in SQL" style={{ border: "none", cursor: "pointer", background: "none", padding: 0 }}>
                            <Pill bg={s.bg} fg={s.fg}>
                              {t.status} <span style={{ marginLeft: 4, opacity: 0.6 }}>↻</span>
                            </Pill>
                          </button>
                        </td>
                        <td style={{ padding: "14px 16px", color: COLORS.sub }}>{t.assignee}</td>
                        <td style={{ padding: "14px 16px", color: COLORS.sub }}>{t.created}</td>
                        <td style={{ padding: "14px 16px", textAlign: "right" }}>
                          <button onClick={() => onDeleteTicket(t.id)} title="Delete ticket" style={{ border: "none", background: "none", cursor: "pointer", color: COLORS.sub, padding: 4 }}>
                            <Icons.X size={15} />
                          </button>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

            }}>

                    <Icons.X size={18} />

                </div>

                <div style={{ background: COLORS.paper, padding: "12px 14px", borderRadius: 8, marginBottom: 16, fontSize: 13 }}>
                  <div><b>Employee:</b> {resetModal.emp?.name}</div>
                  <div style={{ color: COLORS.sub, marginTop: 2 }}><b>Emp ID:</b> {resetModal.emp?.id} · <b>Role:</b> {resetModal.emp?.role}</div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!resetModal.newPassword) return;

                  <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
                    <button type="button" onClick={() => setResetModal({ ...resetModal, newPassword: "password123" })} style={{ padding: "4px 8px", fontSize: 11.5, borderRadius: 4, border: `1px solid ${COLORS.line}`, background: "#fff", cursor: "pointer" }}>Set: password123</button>
                    <button type="button" onClick={() => setResetModal({ ...resetModal, newPassword: "Welcome@" + Math.floor(1000 + Math.random() * 9000) })} style={{ padding: "4px 8px", fontSize: 11.5, borderRadius: 4, border: `1px solid ${COLORS.line}`, background: "#fff", cursor: "pointer" }}>Generate Random</button>
                  </div>

                  <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>

    /* ---------------------------------- OFFER LETTER ---------------------------------- */
    function OfferLetter({ offers, onAddOffer, onAdvanceOffer, onDeleteOffer, searchQuery }) {
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ candidate: "", role: "", dept: "Engineering" });

      const filtered = offers.filter(o => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return o.candidate.toLowerCase().includes(q) || o.role.toLowerCase().includes(q) || o.dept.toLowerCase().includes(q) || o.id.toLowerCase().includes(q);
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.candidate || !form.role) return;
        onAddOffer(form);
        setForm({ candidate: "", role: "", dept: "Engineering" });
        setShowForm(false);
      };

      return (
        <div className="fade-in">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontWeight: 700, fontSize: 16, color: COLORS.ink }}>Candidate offer letters (SQL Table: offers)</div>
            <button className="btn-action" onClick={() => setShowForm(!showForm)} style={{
              display: "flex", alignItems: "center", gap: 6, background: COLORS.accent, color: "#fff",
              border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 13.5, fontWeight: 600, cursor: "pointer"
            }}>
              <Icons.Plus size={16} /> New offer draft
            </button>
          </div>

          {showForm && (
            <form onSubmit={handleSubmit} style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 18, marginBottom: 16, display: "flex", gap: 10, flexWrap: "wrap" }}>
              <input placeholder="Candidate full name" required value={form.candidate} onChange={e => setForm({ ...form, candidate: e.target.value })}
                style={{ flex: 1, minWidth: 180, padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5 }} />
              <input placeholder="Target Role" required value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}
                style={{ flex: 1, minWidth: 160, padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5 }} />
              <select value={form.dept} onChange={e => setForm({ ...form, dept: e.target.value })}
                style={{ padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5, background: "#fff" }}>
                {["Engineering", "Quality", "IT Support", "Human Resources", "Operations"].map(d => <option key={d}>{d}</option>)}
              </select>
              <button type="submit" className="btn-action" style={{ background: COLORS.navy, color: "#fff", border: "none", borderRadius: 8, padding: "9px 20px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Create draft in SQL</button>
            </form>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {filtered.map(o => {
              const s = statusStyle(o.status);
              return (
                <div key={o.id} className="hover-lift" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "16px 20px", display: "flex", alignItems: "center", gap: 16 }}>
                  <div style={{
                    width: 40, height: 40, borderRadius: 10, background: COLORS.accentSoft,
                    display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0
                  }}>
                    <Icons.FileSignature size={18} color={COLORS.accent} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, color: COLORS.ink, fontSize: 14.5 }}>{o.candidate}</div>

                  </div>
                  <div style={{ fontSize: 12.5, color: COLORS.sub }}>{o.date}</div>
                  <Pill bg={s.bg} fg={s.fg}>{o.status}</Pill>
                  {["Draft", "Sent"].includes(o.status) && (
                    <button className="btn-action" onClick={() => onAdvanceOffer(o.id)} style={{
                      border: `1px solid ${COLORS.line}`, background: "#fff", borderRadius: 8,

                      display: "flex", alignItems: "center", gap: 4
                    }}>
                      {o.status === "Draft" ? "Send Offer" : "Mark Accepted"} <Icons.ChevronRight size={14} />
                    </button>
                  )}
                  <button onClick={() => onDeleteOffer(o.id)} title="Delete offer" style={{ border: "none", background: "none", cursor: "pointer", color: COLORS.sub, padding: 4 }}>

    /* ---------------------------------- MAIN APP SHELL ---------------------------------- */
    const ALL_NAV = [
      { key: "dashboard", label: "Dashboard", icon: Icons.LayoutDashboard },
      { key: "tracker", label: "Issue Tracker", icon: Icons.Ticket },
      { key: "employee", label: "Employee", icon: Icons.Users },
      { key: "admin", label: "Admin & Perms", icon: Icons.ShieldCheck },
      { key: "offer", label: "Offer Letter", icon: Icons.FileSignature },
    ];

    function SupportHub() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem("supporthub_user");
        return saved ? JSON.parse(saved) : null;
      });
      const [userPermissions, setUserPermissions] = useState(() => {
        const saved = localStorage.getItem("supporthub_perms");
        return saved ? JSON.parse(saved) : ["dashboard", "tracker", "employee", "admin", "offer"];
      });

      const [tab, setTab] = useState("dashboard");
      const [tickets, setTickets] = useState([]);
      const [employees, setEmployees] = useState([]);
      const [offers, setOffers] = useState([]);
      const [activityLogs, setActivityLogs] = useState([]);
      const [permissions, setPermissions] = useState([]);
      const [stats, setStats] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [loading, setLoading] = useState(true);
      const [dbConnected, setDbConnected] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Filter navigation items by active user's permissions
      const visibleNav = useMemo(() => {
        if (!currentUser) return [];
        return ALL_NAV.filter(item => userPermissions.includes(item.key));
      }, [currentUser, userPermissions]);

      // Ensure active tab is allowed
      useEffect(() => {
        if (visibleNav.length > 0 && !visibleNav.some(n => n.key === tab)) {
          setTab(visibleNav[0].key);
        }
      }, [visibleNav, tab]);

      const loadData = async () => {
        try {
          const [tRes, eRes, oRes, lRes, sRes, pRes] = await Promise.all([
            fetch("/api/tickets").then(r => r.json()),
            fetch("/api/employees").then(r => r.json()),
            fetch("/api/offers").then(r => r.json()),
            fetch("/api/activity-logs").then(r => r.json()),
            fetch("/api/dashboard/stats").then(r => r.json()),
            fetch("/api/permissions").then(r => r.json()),
          ]);
          setTickets(tRes || []);
          setEmployees(eRes || []);
          setOffers(oRes || []);
          setActivityLogs(lRes || []);
          setStats(sRes || null);
          setPermissions(pRes || []);
          setDbConnected(true);
        } catch (err) {
          console.error("Error fetching data from SQL backend:", err);
          showToast("Failed to connect to SQL database backend", "error");
          setDbConnected(false);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleLoginSuccess = (data) => {
        setCurrentUser(data.employee);
        setUserPermissions(data.permissions);
        localStorage.setItem("supporthub_user", JSON.stringify(data.employee));
        localStorage.setItem("supporthub_perms", JSON.stringify(data.permissions));
        showToast(`Welcome ${data.employee.name}! Logged in as ${data.employee.role}`);
        loadData();
      };

      const handleLogout = async () => {
        if (currentUser) {
          try {
            await fetch("/api/auth/logout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ emp_id: currentUser.id })
            });
          } catch (e) {
            console.error(e);
          }
        }
        setCurrentUser(null);
        localStorage.removeItem("supporthub_user");
        localStorage.removeItem("supporthub_perms");
        showToast("Logged out successfully");
      };

      const handleUpdatePermissions = async (role, modules) => {
        try {
          const res = await fetch(`/api/permissions/${encodeURIComponent(role)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ modules })
          });
          if (!res.ok) throw new Error("Failed to update permissions in SQL");
          showToast(`Updated permissions for role: ${role}`);
          if (currentUser && currentUser.role === role) {
            setUserPermissions(modules);
            localStorage.setItem("supporthub_perms", JSON.stringify(modules));
          }
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleAddTicket = async (ticketData) => {
        try {
          const res = await fetch("/api/tickets", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ticketData),
          });
          if (!res.ok) throw new Error("Failed to create ticket");
          const created = await res.json();
          setTickets(prev => [created, ...prev]);
          showToast(`Created ticket ${created.id} in SQL!`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleCycleTicketStatus = async (id) => {
        try {
          const res = await fetch(`/api/tickets/${id}/status`, { method: "PATCH" });
          if (!res.ok) throw new Error("Failed to update status");
          const updated = await res.json();
          setTickets(prev => prev.map(t => t.id === id ? updated : t));
          showToast(`Updated ${id} to ${updated.status}`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleDeleteTicket = async (id) => {
        try {
          const res = await fetch(`/api/tickets/${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("Failed to delete ticket");
          setTickets(prev => prev.filter(t => t.id !== id));
          showToast(`Deleted ticket ${id}`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleAddEmployee = async (empData) => {
        try {
          const res = await fetch("/api/employees", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(empData),
          });
          if (!res.ok) throw new Error("Failed to add employee");
          const created = await res.json();
          setEmployees(prev => [...prev, created]);
          showToast(`Added ${created.name} (${created.id}) to employees table!`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleDeleteEmployee = async (id) => {
        try {
          const res = await fetch(`/api/employees/${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("Failed to delete employee");
          setEmployees(prev => prev.filter(e => e.id !== id));
          showToast(`Removed employee ${id} from SQL database`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleToggleEmployeeStatus = async (id) => {
        try {
          const res = await fetch(`/api/employees/${id}/toggle-status`, { method: "POST" });
          if (!res.ok) throw new Error("Failed to toggle status");
          const updated = await res.json();
          setEmployees(prev => prev.map(e => e.id === id ? updated : e));
          showToast(`${updated.name} is now ${updated.status}`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleAddOffer = async (offerData) => {
        try {
          const res = await fetch("/api/offers", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(offerData),
          });
          if (!res.ok) throw new Error("Failed to create offer");
          const created = await res.json();
          setOffers(prev => [created, ...prev]);
          showToast(`Created offer draft ${created.id} in SQL`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleAdvanceOffer = async (id) => {
        try {
          const res = await fetch(`/api/offers/${id}/advance`, { method: "PATCH" });
          if (!res.ok) throw new Error("Failed to advance offer");
          const updated = await res.json();
          setOffers(prev => prev.map(o => o.id === id ? updated : o));
          showToast(`Offer ${id} advanced to ${updated.status}`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleResetPassword = async (empId, newPassword) => {
        try {
          const res = await fetch(`/api/employees/${empId}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ new_password: newPassword, admin_id: currentUser.id })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Failed to reset password");
          showToast(`Password for employee ${empId} reset successfully!`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      const handleDeleteOffer = async (id) => {
        try {
          const res = await fetch(`/api/offers/${id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("Failed to delete offer");
          setOffers(prev => prev.filter(o => o.id !== id));
          showToast(`Deleted offer ${id}`);
          loadData();
        } catch (e) {
          showToast(e.message, "error");
        }
      };

      // If user is not logged in, show Login Screen
      if (!currentUser) {
        return (
          <>
            <LoginScreen onLoginSuccess={handleLoginSuccess} />
            <Toast toast={toast} />
          </>
        );
      }

      const titleFor = tab === "dashboard" ? "Dashboard" : ALL_NAV.find(n => n.key === tab)?.label;

      return (
        <div style={{ display: "flex", minHeight: "100vh", background: COLORS.paper, fontFamily: "'Inter', sans-serif" }}>
          {/* Sidebar */}
          <div style={{ width: 236, background: COLORS.navyDeep, padding: "22px 14px", display: "flex", flexDirection: "column", flexShrink: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 8px", marginBottom: 26 }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: "#fff", fontSize: 15 }}>S</div>
              <div>
                <div style={{ color: "#fff", fontWeight: 700, fontSize: 15, letterSpacing: -0.3 }}>SupportHub</div>
                <div style={{ color: "rgba(255,255,255,0.45)", fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}>
                  <Icons.Circle size={6} fill={dbConnected ? "#10B981" : "#EF4444"} color="none" />
                  {dbConnected ? "SQL Connected" : "Connecting..."}
                </div>
              </div>
            </div>

            {/* Navigation Tabs allowed by RBAC */}
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {visibleNav.map(n => {
                const active = tab === n.key;
                const Icon = n.icon;
                return (
                  <button key={n.key} onClick={() => setTab(n.key)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 8,
                    background: active ? "rgba(255,255,255,0.12)" : "transparent", border: "none", cursor: "pointer",
                    color: active ? "#fff" : "rgba(255,255,255,0.65)", fontSize: 13.5, fontWeight: active ? 600 : 500, textAlign: "left",
                    transition: "all 0.15s ease"
                  }}>
                    <Icon size={17} /> {n.label}
                  </button>
                );
              })}
            </div>

            {/* User Profile and Logout */}
            <div style={{ marginTop: "auto", padding: "14px 8px", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <div style={{ width: 34, height: 34, borderRadius: "50%", background: currentUser.role === "Admin" ? COLORS.purple : COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 12.5, fontWeight: 700 }}>
                  {currentUser.name.split(" ").map(w => w[0]).join("")}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ color: "#fff", fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{currentUser.name}</div>
                  <div style={{ color: "rgba(255,255,255,0.5)", fontSize: 11 }}>{currentUser.id} · {currentUser.role}</div>
                </div>
              </div>

              <button
                onClick={handleLogout}
                style={{
                  width: "100%", padding: "7px 10px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.15)",
                  background: "transparent", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 6
                }}
              >
                <Icons.LogOut size={13} /> Switch Account / Logout
              </button>
            </div>
          </div>

          {/* Main Content Area */}
          <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "16px 28px", borderBottom: `1px solid ${COLORS.line}`, background: COLORS.card
            }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.ink, letterSpacing: -0.4 }}>{titleFor}</div>
                <div style={{ fontSize: 12, color: COLORS.sub }}>Logged in as <b>{currentUser.name}</b> ({currentUser.id} · {currentUser.role})</div>
              </div>

              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ position: "relative" }}>
                  <div style={{ position: "absolute", left: 10, top: 10, color: COLORS.sub }}>
                    <Icons.Search size={15} />
                  </div>
                  <input
                    placeholder="Search in database…"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    style={{
                      padding: "8px 12px 8px 32px", borderRadius: 8, border: `1px solid ${COLORS.line}`,
                      fontSize: 13, width: 200, background: COLORS.paper, outline: "none"
                    }}
                  />
                </div>
                
                <button onClick={loadData} title="Refresh from database" style={{
                  background: COLORS.paper, border: `1px solid ${COLORS.line}`, borderRadius: 8,
                  padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: COLORS.ink, fontWeight: 500
                }}>
                  <Icons.RefreshCw size={14} /> Refresh
                </button>

                {/* User status pill in header */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 8, background: "#F1F5F9",
                  padding: "5px 12px", borderRadius: 20, border: `1px solid ${COLORS.line}`
                }}>
                  <div style={{ width: 22, height: 22, borderRadius: "50%", background: currentUser.role === "Admin" ? COLORS.purple : COLORS.accent, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 11, fontWeight: 700 }}>
                    {currentUser.name.split(" ").map(w => w[0]).join("")}
                  </div>
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.ink }}>{currentUser.name}</span>
                  <span style={{ fontSize: 11, color: COLORS.sub }}>({currentUser.id})</span>
                </div>

                {/* Prominent Header Log Out Button */}
                <button
                  onClick={handleLogout}
                  title="Log out of application"
                  className="btn-action"
                  style={{
                    display: "flex", alignItems: "center", gap: 6,
                    background: COLORS.redSoft, color: COLORS.red,
                    border: `1px solid #FECACA`, borderRadius: 8,
                    padding: "7px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer"
                  }}
                >
                  <Icons.LogOut size={14} color={COLORS.red} /> Log Out
                </button>
              </div>
            </div>

            <div style={{ padding: "24px 28px", flex: 1 }}>
              {loading ? (
                <div style={{ textAlign: "center", padding: "60px 20px", color: COLORS.sub }}>
                  <Icons.Database size={28} color={COLORS.accent} />
                  <div style={{ marginTop: 10, fontWeight: 600 }}>Loading data from SQL database...</div>
                </div>
              ) : (
                <>
                  {tab === "dashboard" && <Dashboard tickets={tickets} stats={stats} activityLogs={activityLogs} />}
                  {tab === "tracker" && <IssueTracker tickets={tickets} onAddTicket={handleAddTicket} onCycleStatus={handleCycleTicketStatus} onDeleteTicket={handleDeleteTicket} searchQuery={searchQuery} currentUser={currentUser} />}
                  {tab === "employee" && <Employee employees={employees} activityLogs={activityLogs} onToggleStatus={handleToggleEmployeeStatus} searchQuery={searchQuery} currentUser={currentUser} />}
                  {tab === "admin" && <Admin employees={employees} permissions={permissions} onAddEmployee={handleAddEmployee} onDeleteEmployee={handleDeleteEmployee} onUpdatePermissions={handleUpdatePermissions} onResetPassword={handleResetPassword} />}
                  {tab === "offer" && <OfferLetter offers={offers} onAddOffer={handleAddOffer} onAdvanceOffer={handleAdvanceOffer} onDeleteOffer={handleDeleteOffer} searchQuery={searchQuery} />}
                </>
              )}
            </div>
          </div>

          <Toast toast={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SupportHub />);
  </script>

  <!-- Robust dependency loader + JSX compiler bootstrap -->
  <script>
    (function () {
      var loader = document.getElementById("loading-screen");

      function showBootError(title, detail) {
        if (!loader) return;
        loader.innerHTML =
          '<div style="padding:40px;text-align:center;color:#fff;max-width:620px">' +
          '<div style="font-size:32px;margin-bottom:16px">⚠️</div>' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:10px">' + title + '</div>' +
          '<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,.7)">' + detail + '</div>' +
          '<button onclick="location.reload()" style="margin-top:20px;border:0;border-radius:8px;background:#2F6FED;color:#fff;padding:10px 18px;font-weight:700;cursor:pointer">Reload</button>' +
          '</div>';
      }

      function loadScript(name, urls) {
        return new Promise(function (resolve, reject) {
          var index = 0;
          function attempt() {
            if (index >= urls.length) {
              reject(new Error(name + ' could not be loaded from the available CDNs.'));
              return;
            }
            var src = urls[index++];
            var script = document.createElement('script');
            script.src = src;
            script.async = false;
            script.onload = function () { resolve(); };
            script.onerror = function () {
              script.remove();
              attempt();
            };
            document.head.appendChild(script);
          }
          attempt();
        });
      }

      async function boot() {
        try {
          await loadScript('React', [
            'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
            'https://unpkg.com/react@18.3.1/umd/react.production.min.js'
          ]);

          await loadScript('ReactDOM', [
            'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
            'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'
          ]);

          await loadScript('Babel', [
            'https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js',
            'https://unpkg.com/@babel/standalone@7.23.10/babel.min.js'
          ]);

          // Recharts is not needed for the login screen, so failure here should not
          // prevent the rest of SupportHub from starting.
          try {
            await loadScript('PropTypes', [
              'https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js',
              'https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js',
              'https://unpkg.com/prop-types@15.8.1/prop-types.min.js'
            ]);
          } catch (e) {}

          try {
            await loadScript('Recharts', [
              'https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js',
              'https://unpkg.com/recharts@2.12.7/umd/Recharts.js'
            ]);
          } catch (e) {
            window.Recharts = window.Recharts || {};
          }

          if (!window.React || !window.ReactDOM || !window.Babel) {
            throw new Error('A required frontend dependency is missing.');
          }

          var sourceNode = document.getElementById('supporthub-app-source');
          var source = sourceNode ? sourceNode.textContent : '';
          if (!source.trim()) throw new Error('SupportHub application source was not found.');

          var compiled = Babel.transform(source, { presets: ['env', 'react'] }).code;
          var appScript = document.createElement('script');
          appScript.text = compiled;
          document.body.appendChild(appScript);
          sourceNode.remove();
        } catch (error) {
          console.error('SupportHub boot error:', error);
          showBootError(
            'SupportHub could not start',
            'A required frontend script could not be loaded. The page now shows the actual startup error instead of an endless spinner.<br><br><strong>' +
            String(error && error.message ? error.message : error) + '</strong>'
          );
        }
      }

      boot();
    })();
  </script>
</body>
</html>
